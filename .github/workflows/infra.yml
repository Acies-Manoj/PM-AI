name: infra

# Everything about the infrastructure, started by a push (Approach 2, single step).
#
#   pull request   plan only
#   push           plan, then the apply job waits for a reviewer to approve the "practice" environment.
#                  After the apply the latest task definition revision is rolled out
#                  (see .github/actions/sync-task-definition).
#
# FIRST DEPLOYMENT of a new environment (the state is empty): the same push does everything. One apply
# creates every resource with desired_count = 1 (CORS is automatic). The image repository is empty during
# that apply, so ECS cannot start the container yet; the last job then builds and pushes the image, prints
# what ECS did while the image was missing, forces a new deployment and waits until the service is stable.
#
# Also called by prompts.yml (workflow_call) after new prompt versions are published.
#
# Needs in the GitHub repo:
#   Variables: AWS_ROLE_ARN, TF_STATE_BUCKET
#   Secret:    TF_VAR_amplify_access_token (used only by the apply step, to create the Amplify app)
#   Environment: practice (with a required reviewer)

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [single-1step]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: false
      ref:
        description: "Commit to run on (default: the commit that started the run)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: tofu-practice-manoj
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_VAR_FILE: environments/opentofu/practice.tfvars
  TF_PROMPT_IDS_FILE: environments/opentofu/prompt-ids-practice.tfvars.json
  TF_BACKEND_FILE: environments/opentofu/backend-practice.hcl
  ECS_CLUSTER: pmai-practice-manoj-cluster
  ECS_SERVICE: pmai-practice-manoj-backend-service
  ECS_TASK_FAMILY: pmai-practice-manoj-backend

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      first: ${{ steps.new.outputs.first }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false

      - name: Init
        run: tofu init -input=false -backend-config="$TF_BACKEND_FILE" -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # An empty state means a new environment: the first deployment, which also pushes the image.
      - name: Is this a new environment?
        id: new
        run: |
          COUNT=$(tofu state list | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "A new environment (the state is empty): this run will also push the first image."
            echo "first=true" >> "$GITHUB_OUTPUT"
          else
            echo "The environment exists ($COUNT resources in the state)."
            echo "first=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate
        run: tofu validate

      # aws_profile is blank in CI: the role from OIDC supplies the credentials. In a new environment the
      # task definition points at this commit's image tag, which the last job pushes.
      - name: Plan
        env:
          FIRST: ${{ steps.new.outputs.first }}
        run: |
          EXTRA=""
          if [ "$FIRST" = "true" ]; then EXTRA="-var=image_tag=$(git rev-parse HEAD | cut -c1-7)"; fi
          tofu plan -input=false -lock-timeout=5m -var-file="$TF_VAR_FILE" -var-file="$TF_PROMPT_IDS_FILE" -var="aws_profile=" $EXTRA

  apply:
    needs: plan
    if: github.event_name == 'push' || inputs.apply
    runs-on: ubuntu-latest
    environment: practice
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false

      - name: Init
        run: tofu init -input=false -backend-config="$TF_BACKEND_FILE" -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # The reviewer approved the environment after reading the plan job. This step plans again
      # and applies, so it can differ from that plan if infra changed in between.
      - name: Apply
        env:
          FIRST: ${{ needs.plan.outputs.first }}
          TF_VAR_amplify_access_token: ${{ secrets.TF_VAR_amplify_access_token }}
        run: |
          EXTRA=""
          if [ "$FIRST" = "true" ]; then EXTRA="-var=image_tag=$(git rev-parse HEAD | cut -c1-7)"; fi
          tofu apply -auto-approve -input=false -lock-timeout=5m -var-file="$TF_VAR_FILE" -var-file="$TF_PROMPT_IDS_FILE" -var="aws_profile=" $EXTRA

      # OpenTofu ignores the service's task definition (the app workflow owns the image), so an
      # environment change (prompt ids, CORS) only reaches the running container through this step.
      - name: Roll out the latest task definition
        uses: ./.github/actions/sync-task-definition
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          family: ${{ env.ECS_TASK_FAMILY }}

  # Only for a new environment, right after its first apply (already approved).
  first-image:
    needs: [plan, apply]
    if: needs.plan.outputs.first == 'true' && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false

      - name: Init
        run: tofu init -input=false -backend-config="$TF_BACKEND_FILE" -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Build and push the image
        run: |
          TAG=$(git rev-parse HEAD | cut -c1-7)
          REPO_URL=$(tofu output -raw ecr_repository_url)
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REPO_URL%%/*}"
          docker build -t "$REPO_URL:$TAG" ../backend
          docker push "$REPO_URL:$TAG"

      # ECS has been trying to start a container from an image that did not exist until now.
      - name: Show what ECS did while the image was missing
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,deployments:deployments[].{status:status,rollout:rolloutState,reason:rolloutStateReason,failedTasks:failedTasks},events:events[:8].message}' \
            --output json

      - name: Force a new deployment
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --query 'service.deployments[].{status:status,rollout:rolloutState}' --output json

      - name: Wait until the service is stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Next steps
        run: |
          echo "API health: $(tofu output -raw api_gateway_url)health"
          echo "Frontend: $(tofu output -raw frontend_origin)"
          echo "Amplify builds the site on its own once the GitHub app is authorised in the Amplify console."
