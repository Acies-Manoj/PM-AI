name: prompts

# Publishes the prompt text in backend/prompts/ to Amazon Bedrock Prompt Management as NEW VERSIONS,
# records the resulting ids, and hands them to the infra workflow so the backend uses them.
#
#   pull request   lint the prompt files (no AWS: create --dry-run)
#   push           for each prompt file that changed: check nobody published that prompt outside this
#                  pipeline, publish a new version, update ONLY that prompt's id in the ids file,
#                  commit it, then run the infra workflow (plan, approval, apply, roll out)
#   manual run     "all" creates every prompt that does not exist yet (first-time setup of an
#                  environment) and adds the new ids to the ids file. Existing ids are never changed,
#                  and nothing is deployed.
#
# Signs in with the same role as the infra workflow (it needs the Bedrock prompt permissions in
# infra/ci/pipeline-permissions-policy.json). Needs the variables and secret the infra workflow needs.

on:
  pull_request:
    paths:
      - "backend/prompts/**"
      - "backend/scripts/bedrock_prompts.py"
  push:
    branches: [enhanced-with-agents-infra]
    paths:
      - "backend/prompts/**"
  workflow_dispatch:
    inputs:
      all:
        description: "Create every missing prompt (first-time setup of an environment)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prompts-practice
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  BEDROCK_REGION: eu-north-1
  IDS_FILE: infra/environments/opentofu/prompt-ids-practice.tfvars.json

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install python-dotenv boto3

      # Checks that every prompt file exists and only uses the {{placeholders}} the code fills in.
      - name: Check the prompt files
        working-directory: backend
        run: python scripts/bedrock_prompts.py create --dry-run

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      ids_changed: ${{ steps.commit.outputs.ids_changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install python-dotenv boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Each "create --update" makes a new version even when the text is unchanged, so only the
      # files git reports as changed in this push are published.
      - name: Find the prompts that changed
        id: changed
        env:
          ALL: ${{ inputs.all }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$ALL" = "true" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- backend/prompts \
            | grep -E '\.txt$' | sed -E 's#^backend/prompts/##; s#\.txt$##' | paste -sd, - || true)
          if [ -z "$CHANGED" ]; then
            echo "No prompt file changed."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "Changed prompts: $CHANGED"
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "only=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      # Bedrock is shared: a teammate can publish a newer version of the same prompt from another
      # branch. Publishing this repo's text over it would silently replace their wording as the
      # latest version, so stop when Bedrock's latest version is not the one recorded in the ids file.
      - name: Check nobody published these prompts outside this pipeline
        if: steps.changed.outputs.mode == 'update'
        env:
          ONLY: ${{ steps.changed.outputs.only }}
        run: |
          (cd backend && python scripts/bedrock_prompts.py create --only "$ONLY" --out prompts_check)
          python - <<'EOF'
          import json, os, sys
          committed = json.load(open(os.environ["IDS_FILE"]))["bedrock_prompt_ids"]
          latest = json.load(open("backend/prompts_check/bedrock_prompt_ids.json"))
          drift = {k: (committed[k], v) for k, v in latest.items() if k in committed and committed[k] != v}
          if drift:
              print("Bedrock has a different latest version than the ids file records:")
              for name, (recorded, found) in sorted(drift.items()):
                  print(f"  {name}: ids file {recorded}, Bedrock latest {found}")
              print("Someone published this prompt outside the pipeline. Compare the texts, merge the")
              print("wording you want into backend/prompts/, set the id in the ids file to the version")
              print("you accept, and push again.")
              sys.exit(1)
          print("No drift: Bedrock's latest versions match the ids file.")
          EOF

      - name: Publish
        if: steps.changed.outputs.mode != 'none'
        env:
          MODE: ${{ steps.changed.outputs.mode }}
          ONLY: ${{ steps.changed.outputs.only }}
        working-directory: backend
        run: |
          if [ "$MODE" = "all" ]; then
            python scripts/bedrock_prompts.py create --out prompts_export
          else
            python scripts/bedrock_prompts.py create --update --only "$ONLY" --out prompts_export
          fi

      # prompts_export holds the ids of the prompts this run processed. In "update" mode those
      # replace the recorded ids and every other id stays exactly as committed. In "all" mode only
      # prompts the file does not know yet are added, so an existing id never moves.
      - name: Write the ids file and commit it
        id: commit
        if: steps.changed.outputs.mode != 'none'
        env:
          MODE: ${{ steps.changed.outputs.mode }}
        run: |
          python - <<'EOF'
          import json, os
          path = os.environ["IDS_FILE"]
          try:
              current = json.load(open(path))["bedrock_prompt_ids"]
          except FileNotFoundError:
              current = {}
          new = json.load(open("backend/prompts_export/bedrock_prompt_ids.json"))
          merged = {**new, **current} if os.environ["MODE"] == "all" else {**current, **new}
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(json.dumps({"bedrock_prompt_ids": dict(sorted(merged.items()))}, indent=2) + "\n")
          EOF
          if [ -z "$(git status --porcelain -- "$IDS_FILE")" ]; then
            echo "The ids did not change."
            echo "ids_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$IDS_FILE"
          git commit -m "Update Bedrock prompt versions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "ids_changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with the built-in token does not start other workflows, so the infra workflow is
  # called here. It runs the plan, waits for approval of the practice environment, applies, and
  # rolls the new task definition out. Not called after a manual run.
  infra:
    needs: publish
    if: github.event_name == 'push' && needs.publish.outputs.ids_changed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/infra.yml
    with:
      apply: true
      ref: ${{ needs.publish.outputs.commit }}
    secrets: inherit
